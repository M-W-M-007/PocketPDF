name: Build APK

# Chalta hai jab bhi code push ho, aur "Run workflow" button se bhi.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub runners par Android SDK pehle se hota hai; yeh licences
      # accept karke sdkmanager ko ready kar deta hai.
      - name: Android SDK
        uses: android-actions/setup-android@v3

      # Project mein gradle wrapper nahi hai, isliye Gradle alag se.
      # AGP 8.7.2 ke liye Gradle 8.9 ya usse naya chahiye.
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: APK upload karein
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
